services:
  spatial-agent:
    build: .
    ports:
      - "8088:8088"
    env_file:
      - .env.production
    volumes:
      - ./data:/data:ro
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
