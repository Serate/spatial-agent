name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run smoke check
        run: python scripts/smoke_check.py
      - name: Run stage contract profile
        run: python scripts/test_profile.py --profile stage
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
