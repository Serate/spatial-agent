name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: Stable contract gate
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run stable CI profile
        run: python scripts/test_profile.py --profile ci

  full-offline-regression:
    name: Full historical offline regression (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full offline unittest collector
        run: python scripts/test_profile.py --profile full-regression
