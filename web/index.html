<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>空间智能体控制台</title>
  <style>
    :root { font-family: Inter, "Segoe UI", sans-serif; color: #17212b; background: #eef2f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #17212b; color: #f5f7f8; padding: 20px 28px; display:flex; justify-content:space-between; align-items:center; border-bottom:4px solid #e09a5b; }
    header h1 { margin:0; font-size:21px; letter-spacing:0; } header span { color:#b6c8cc; font-size:13px; }
    main { max-width: 1320px; margin: 0 auto; padding: 24px; display:grid; grid-template-columns: 320px 1fr; gap:20px; }
    section, .panel { background:#fff; border:1px solid #d7e0e4; border-radius:8px; }
    .controls { padding:20px; align-self:start; position:sticky; top:18px; }
    label { display:block; font-size:12px; font-weight:700; color:#52636b; margin:16px 0 7px; text-transform:uppercase; letter-spacing:.06em; }
    input, textarea, select { width:100%; border:1px solid #bdcbd0; border-radius:6px; padding:11px; font:inherit; color:inherit; background:#fbfcfc; }
    textarea { resize:vertical; line-height:1.5; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button { border:0; border-radius:6px; padding:11px 13px; background:#087f8c; color:#fff; font-weight:700; cursor:pointer; }
    button:hover { background:#066d78; } button:disabled { background:#9aabb0; cursor:wait; }
    .hint { color:#697980; font-size:12px; line-height:1.5; margin-top:12px; }
    .content { min-width:0; display:grid; gap:20px; }
    .hero { padding:20px; display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    .hero h2 { margin:0 0 6px; font-size:18px; } .hero p { margin:0; color:#66777e; }
    .badge { border-radius:999px; padding:6px 10px; background:#e6f3ed; color:#176a49; font-size:12px; font-weight:700; white-space:nowrap; }
    .badge.failed, .badge.rejected { background:#fde9e5; color:#a43e2e; } .badge.planning { background:#fff2d8; color:#94651d; }
    .chat { min-height:520px; display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; }
    .chat-head { padding:16px 18px; border-bottom:1px solid #e4eaec; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .chat-head h3 { margin:0; font-size:15px; } .chat-head span { color:#6a7a80; font-size:12px; }
    .chat-actions { display:flex; align-items:center; gap:8px; }
    .chat-actions button { padding:7px 9px; background:#f2f6f7; color:#43555c; font-size:12px; }
    .chat-actions button:hover { background:#e3edef; }
    .messages { padding:18px; overflow:auto; display:flex; flex-direction:column; gap:12px; max-height:520px; background:linear-gradient(#fbfcfc, #f6f9fa); }
    .msg { max-width:78%; display:grid; gap:5px; }
    .msg .role { font-size:11px; color:#6d7c81; font-weight:700; }
    .bubble { border-radius:8px; padding:12px 14px; line-height:1.65; white-space:pre-wrap; box-shadow:0 1px 0 rgba(23,33,43,.04); }
    .msg.user { align-self:flex-end; } .msg.user .role { text-align:right; }
    .msg.user .bubble { background:#087f8c; color:#fff; }
    .msg.assistant .bubble { background:#fff; border:1px solid #dfe7ea; }
    .msg.system .bubble { background:#fff7e9; border:1px solid #f1d6aa; color:#6f501b; }
    .composer { padding:14px; border-top:1px solid #e4eaec; background:#fff; display:grid; grid-template-columns:1fr 110px; gap:10px; align-items:end; }
    .composer textarea { min-height:54px; max-height:150px; }
    .examples { display:grid; gap:8px; margin-top:14px; }
    .example { width:100%; text-align:left; background:#f2f6f7; color:#33444b; font-weight:600; }
    .example:hover { background:#e6eef1; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .panel { padding:18px; min-width:0; } .panel h3 { margin:0 0 14px; font-size:15px; }
    .answer { line-height:1.65; white-space:pre-wrap; } .muted { color:#77868b; }
    .metric-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .metric { background:#f2f6f7; padding:10px; border-radius:6px; } .metric b { display:block; font-size:15px; } .metric small { color:#6c7b80; }
    .stat-context { display:flex; justify-content:space-between; gap:12px; margin-bottom:14px; color:#53656b; font-size:13px; }
    .stat-context strong { color:#17212b; font-size:15px; }
    .range-chart { margin:14px 0 16px; }
    .range-track { position:relative; height:12px; border-radius:999px; background:linear-gradient(90deg,#b8d9cf,#087f8c); }
    .range-mean { position:absolute; top:-5px; width:3px; height:22px; border-radius:3px; background:#e09a5b; transform:translateX(-50%); }
    .range-labels { display:flex; justify-content:space-between; margin-top:7px; color:#6c7b80; font-size:11px; }
    .coverage { margin-top:12px; }
    .coverage-head { display:flex; justify-content:space-between; color:#53656b; font-size:12px; margin-bottom:6px; }
    .coverage-track { height:8px; border-radius:999px; background:#e6eaeb; overflow:hidden; }
    .coverage-fill { height:100%; border-radius:999px; background:#176a49; }
    .distribution { display:grid; grid-template-columns:repeat(10,1fr); align-items:end; gap:4px; height:100px; margin-top:16px; padding-top:8px; border-bottom:1px solid #d7e0e4; }
    .distribution-bar { min-height:2px; border-radius:4px 4px 0 0; background:#53a99a; }
    .distribution-note { margin-top:6px; color:#77868b; font-size:11px; }
    .steps { padding:0; margin:0; list-style:none; } .steps li { border-top:1px solid #e4eaec; padding:11px 0; } .steps li:first-child { border-top:0; padding-top:0; }
    .step-head { display:flex; justify-content:space-between; gap:10px; } .step-tool { font-family:ui-monospace,monospace; font-size:13px; } .step-status { color:#16724d; font-size:12px; font-weight:700; }
    .step-result { margin-top:6px; padding:8px 10px; border-radius:6px; background:#f7faf9; color:#506067; font-size:12px; line-height:1.55; }
    .step-deps { margin-top:5px; color:#087f8c; font-size:11px; }
    .trace { margin:0; padding-left:19px; color:#506067; font-size:13px; line-height:1.7; max-height:220px; overflow:auto; }
    .map { min-height:260px; background:#edf3f1; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; } .map svg { width:100%; height:260px; } .map-empty { color:#77868b; font-size:13px; }
    .links a { display:inline-block; margin-right:12px; color:#087f8c; font-size:13px; } .error { color:#aa3c2b; background:#fff0ed; padding:10px; border-radius:6px; white-space:pre-wrap; }
    .env { margin-top:14px; display:grid; gap:8px; } .env div { background:#f2f6f7; border-radius:6px; padding:9px 10px; font-size:13px; } .env .bad { background:#fff0ed; color:#9d3527; }
    @media (max-width:900px) { main { grid-template-columns:1fr; padding:14px; } .controls { position:static; } .grid { grid-template-columns:1fr; } header { padding:16px; } .composer { grid-template-columns:1fr; } .msg { max-width:92%; } }
  </style>
</head>
<body>
  <header><h1>空间智能体控制台</h1><span>对话 / 规划器 / 运行时 / 空间后端</span></header>
  <main>
    <aside class="controls panel">
      <div class="row"><div><label for="planner">规划器</label><select id="planner"><option value="rule">规则规划器</option><option value="openai">真实大模型</option></select></div><div><label for="backend">空间后端</label><select id="backend"><option value="memory">内存演示</option><option value="local">本地 GIS</option></select></div></div>
      <label for="session">会话 ID</label><input id="session" value="console">
      <div class="examples" aria-label="示例问题">
        <button class="example" data-request="查询DEM栅格元数据">查询 DEM 栅格元数据</button>
        <button class="example" data-request="分析DEM高程统计">分析 DEM 高程统计</button>
        <button class="example" data-request="分析洪山区DEM高程概况">分析洪山区 DEM 高程概况</button>
        <button class="example" data-request="查询洪山区行政区边界">查询洪山区行政区边界</button>
        <button class="example" data-request="查询土地利用栅格元数据">查询土地利用栅格元数据</button>
      </div>
      <div class="hint">真实大模型会读取本地服务商配置。本地 GIS 后端需要用 spatial-agent-gis 环境启动服务。</div>
      <div id="env" class="env"><div>正在检查运行环境...</div></div>
    </aside>
    <div class="content">
      <section class="hero"><div><h2 id="title">准备好进行空间分析</h2><p id="subtitle">在对话框中输入问题，Agent 会生成计划、调用工具并返回结论。</p></div><span id="status" class="badge">待机</span></section>
      <section class="chat">
        <div class="chat-head"><h3>对话</h3><div class="chat-actions"><span id="chatMeta">当前会话：console</span><button id="newSession" type="button">新建会话</button><button id="clearChat" type="button">清空对话</button></div></div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div class="composer">
          <textarea id="prompt" placeholder="例如：查询DEM栅格元数据"></textarea>
          <button id="send">发送</button>
        </div>
      </section>
      <div class="grid">
        <section class="panel"><h3>分析结论</h3><div id="answer" class="answer muted">还没有运行记录。</div><div id="error"></div></section>
        <section class="panel"><h3>栅格统计概览</h3><div id="rasterStats"><div class="metric"><b>-</b><small>等待统计分析</small></div></div></section>
        <section class="panel"><h3>规划指标</h3><div id="metrics" class="metric-grid"><div class="metric"><b>-</b><small>模型</small></div></div></section>
        <section class="panel"><h3>任务计划与步骤</h3><div id="goal" class="muted" style="margin-bottom:14px">尚未生成任务计划。</div><ul id="steps" class="steps"><li class="muted">暂无工具步骤。</li></ul></section>
        <section class="panel"><h3>空间预览</h3><div id="map" class="map"><div class="map-empty">导出本地行政区查询后，可在此预览几何形状。</div></div></section>
        <section class="panel" style="grid-column:1/-1"><h3>执行轨迹</h3><ol id="trace" class="trace"><li class="muted">暂无执行轨迹。</li></ol><div id="links" class="links" style="margin-top:14px"></div></section>
      </div>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusNames={IDLE:'待机',PLANNING:'规划中',EXECUTING:'执行中',COMPLETED:'已完成',NEEDS_CLARIFICATION:'等待澄清',REJECTED:'已拒绝',FAILED:'失败',BLOCKED:'已阻塞'};
    let health={capabilities:{}};
    const statusName=value=>statusNames[value]||value;
    function setStatus(value) { const el=$('status'); el.textContent=statusName(value); el.className='badge '+String(value).toLowerCase(); }
    function appendMessage(role, text) { const labels={user:'你',assistant:'空间智能体',system:'系统'}; const wrap=document.createElement('div'); wrap.className='msg '+role; wrap.innerHTML='<div class="role">'+labels[role]+'</div><div class="bubble">'+escapeHtml(text)+'</div>'; $('messages').appendChild(wrap); $('messages').scrollTop=$('messages').scrollHeight; }
    function welcome() { appendMessage('assistant','你好，我是空间智能体。你可以直接问我 DEM、土地利用或行政区相关问题；如果需要多轮澄清，请保持同一个会话 ID。'); }
    function newSession() { const id='console-'+Date.now().toString(36); $('session').value=id; $('chatMeta').textContent='当前会话：'+id; $('messages').innerHTML=''; $('answer').textContent='还没有运行记录。'; $('answer').className='answer muted'; $('error').innerHTML=''; $('goal').textContent='尚未生成任务计划。'; $('steps').innerHTML='<li class="muted">暂无工具步骤。</li>'; $('trace').innerHTML='<li class="muted">暂无执行轨迹。</li>'; $('links').innerHTML=''; $('map').innerHTML='<div class="map-empty">导出本地行政区查询后，可在此预览几何形状。</div>'; $('rasterStats').innerHTML='<div class="metric"><b>-</b><small>等待统计分析</small></div>'; welcome(); }
    function clearChat() { $('messages').innerHTML=''; welcome(); $('prompt').focus(); }
    function metrics(data) { const m=data.planner_metrics||{}; const items=[['模型',m.model||'-'],['接口协议',m.wire_api||'-'],['规划耗时',m.latency_ms ? m.latency_ms+' 毫秒':'-']]; const usage=m.usage||{}; if(usage.total_tokens!==undefined) items.push(['令牌用量',usage.total_tokens]); $('metrics').innerHTML=items.map(x=>'<div class="metric"><b>'+escapeHtml(x[1])+'</b><small>'+escapeHtml(x[0])+'</small></div>').join(''); }
    function stepResult(result) { if(!result) return '未返回工具结果'; if(result.error) return '业务错误：'+result.error; const s=result.statistics||{}; if(result.admin_name&&result.statistics) return result.admin_name+' · 有效像元 '+(s.valid_pixel_count??'-')+' · 均值 '+(s.mean??'-')+' · NoData '+(s.nodata_ratio===null||s.nodata_ratio===undefined?'-':(Number(s.nodata_ratio)*100).toFixed(3)+'%'); if(result.dataset&&result.statistics) return result.dataset+' · 有效像元 '+(s.valid_pixel_count??'-')+' · 均值 '+(s.mean??'-'); if(result.dataset&&result.metadata) return result.dataset+' · 文件 '+(result.file_count??0)+' 个 · 抽样 '+((result.metrics||{}).probed_files??0)+' 个'; if(result.count!==undefined) return '命中 '+result.count+' 条 · 结果引用 '+(result.result_ref||'-'); return '已返回结构化结果'; }
    function steps(data) { const list=data.steps||[]; $('steps').innerHTML=list.length?list.map(s=>'<li><div class="step-head"><span class="step-tool">'+escapeHtml(s.tool)+'</span><span class="step-status">'+escapeHtml(statusName(s.status))+'</span></div><div class="muted">'+escapeHtml(s.latency_ms||'-')+' 毫秒 · '+escapeHtml(s.attempts||0)+' 次尝试</div>'+(s.depends_on&&s.depends_on.length?'<div class="step-deps">依赖：'+escapeHtml(s.depends_on.join('、'))+'</div>':'<div class="step-deps">无前置依赖</div>')+'<div class="step-result">'+escapeHtml(stepResult(s.result))+'</div></li>').join(''):'<li class="muted">暂无工具步骤。</li>'; }
    function trace(data) { $('trace').innerHTML=(data.trace_summary||[]).map(x=>'<li>'+escapeHtml(x)+'</li>').join('')||'<li class="muted">暂无执行轨迹。</li>'; }
    function rasterStats(data) { const result=(data.steps||[]).map(s=>s.result||{}).find(x=>x.statistics); if(!result){ $('rasterStats').innerHTML='<div class="metric"><b>-</b><small>等待统计分析</small></div>'; return; } const s=result.statistics||{}; if(s.error){ $('rasterStats').innerHTML='<div class="error">'+escapeHtml(s.error)+'</div>'; return; } const min=Number(s.minimum), max=Number(s.maximum), mean=Number(s.mean); const position=Number.isFinite(min)&&Number.isFinite(max)&&max>min?Math.max(0,Math.min(100,(mean-min)/(max-min)*100)):50; const nodata=Number(s.nodata_ratio); const valid=Number(s.valid_pixel_count||0); const analyzed=Number((result.metrics||{}).analyzed_files||0); const files=Number(result.file_count||0); const title=result.admin_name?result.admin_name+' · '+(result.dataset||'栅格'):result.dataset||'栅格'; const items=[['最小值',s.minimum],['最大值',s.maximum],['平均值',s.mean],['标准差',s.standard_deviation],['有效像元',valid.toLocaleString('zh-CN')],['NoData比例',Number.isFinite(nodata)?(nodata*100).toFixed(3)+'%':'-']]; const bins=(s.distribution||{}).bins||[]; const peak=Math.max(1,...bins.map(x=>Number(x.count)||0)); const chart=bins.length?'<div class="distribution" aria-label="栅格值分布">'+bins.map(x=>'<div class="distribution-bar" style="height:'+Math.max(2,Number(x.count||0)/peak*92)+'px" title="'+escapeHtml(x.lower)+' 至 '+escapeHtml(x.upper)+'：'+escapeHtml(x.count)+' 个样本"></div>').join('')+'</div><div class="distribution-note">值分布（受限样本 '+escapeHtml((s.distribution||{}).sample_count||0)+' 个）</div>':''; $('rasterStats').innerHTML='<div class="stat-context"><strong>'+escapeHtml(title)+'</strong><span>分析 '+escapeHtml(analyzed)+' / '+escapeHtml(files)+' 个文件</span></div><div class="range-chart"><div class="range-track"><span class="range-mean" style="left:'+position+'%" title="均值"></span></div><div class="range-labels"><span>最小值 '+escapeHtml(s.minimum)+'</span><span>均值 '+escapeHtml(s.mean)+'</span><span>最大值 '+escapeHtml(s.maximum)+'</span></div></div><div class="metric-grid">'+items.map(x=>'<div class="metric"><b>'+escapeHtml(x[1])+'</b><small>'+escapeHtml(x[0])+'</small></div>').join('')+'</div>'+chart+'<div class="coverage"><div class="coverage-head"><span>有效像元覆盖</span><span>'+escapeHtml(valid.toLocaleString('zh-CN'))+' 个</span></div><div class="coverage-track"><div class="coverage-fill" style="width:'+(Number.isFinite(nodata)?Math.max(0,Math.min(100,(1-nodata)*100)):0)+'%"></div></div></div>'; }
    function mapPreview(geo) { const features=(geo.features||[]).filter(f=>f.geometry&&f.geometry.coordinates); if(!features.length){$('map').innerHTML='<div class="map-empty">当前结果没有可预览的几何形状。</div>';return;} const coords=[]; const walk=x=>Array.isArray(x[0])?x.forEach(walk):coords.push(x); features.forEach(f=>walk(f.geometry.coordinates)); const xs=coords.map(x=>x[0]),ys=coords.map(x=>x[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),sx=x=>12+(x-minx)/(maxx-minx||1)*476,sy=y=>248-(y-miny)/(maxy-miny||1)*236; const path=f=>{let out=''; const walkRing=r=>{out+='M '+sx(r[0][0])+' '+sy(r[0][1])+' ';r.slice(1).forEach(p=>out+='L '+sx(p[0])+' '+sy(p[1])+' ');out+='Z ';}; const walkGeom=g=>g.type==='Polygon'?g.coordinates.forEach(walkRing):g.coordinates.forEach(p=>p.forEach(walkRing)); walkGeom(f.geometry);return out;}; $('map').innerHTML='<svg viewBox="0 0 500 260" role="img" aria-label="GeoJSON 空间预览">'+features.map(f=>'<path d="'+path(f)+'" fill="#83c8b0" stroke="#176a49" stroke-width="1.2" opacity=".8"></path>').join('')+'</svg>'; }
    function rasterPreview(result) { const b=result&&result.bounds; if(!Array.isArray(b)||b.length!==4){$('map').innerHTML='<div class="map-empty">当前结果没有可预览的空间范围。</div>';return;} const width=b[2]-b[0],height=b[3]-b[1],x=width>=height?12:12+(1-height/(width||1))*238,y=height>=width?12:12+(1-width/(height||1))*118,w=width>=height?476:Math.max(8,476*width/(height||1)),h=height>=width?236:Math.max(8,236*height/(width||1)); $('map').innerHTML='<svg viewBox="0 0 500 260" role="img" aria-label="栅格覆盖范围预览"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="#b8d9cf" stroke="#087f8c" stroke-width="2"></rect><text x="250" y="244" text-anchor="middle" fill="#53656b" font-size="12">'+escapeHtml(result.dataset||'栅格')+' · '+escapeHtml(result.crs||'未知 CRS')+'</text></svg>'; }
    async function loadGeoJSON(ref) { const name=ref.split(/[\\/]/).pop(); const response=await fetch('/artifacts/geojson/'+encodeURIComponent(name)); if(response.ok) mapPreview(await response.json()); }
    function llmHealthLabel(caps) { if(caps.live_llm) return ['真实大模型','可用',true]; if(caps.live_llm_configured) return ['真实大模型','网络受限',false]; return ['真实大模型','未配置',false]; }
    function renderHealth(data) { health=data; const caps=data.capabilities||{}; const rows=[['内存演示',caps.memory_backend?'可用':'不可用',caps.memory_backend],['本地 GIS',caps.local_gis_backend?'可用':'不可用',caps.local_gis_backend],llmHealthLabel(caps)]; $('env').innerHTML=rows.map(x=>'<div class="'+(x[2]?'':'bad')+'">'+x[0]+'：'+x[1]+'</div>').join(''); }
    async function loadHealth() { try { const response=await fetch('/health'); renderHealth(await response.json()); } catch(e) { $('env').innerHTML='<div class="bad">无法读取运行环境状态</div>'; } }
    function validateSelection() { const caps=health.capabilities||{}; if($('backend').value==='local'&&!caps.local_gis_backend) throw new Error('当前服务不是 GIS 环境。本地 GIS 后端需要用 scripts/start_console.ps1 -Mode gis 启动。'); if($('planner').value==='openai'&&!caps.live_llm_configured) throw new Error('当前服务没有可用的大模型配置。请先配置 config/openai.local.json 或环境变量。'); if($('planner').value==='openai'&&!caps.live_llm_network) throw new Error('当前服务进程不能访问大模型网络。请从允许出站网络的终端重新启动服务，或先切回规则规划器。'); }
    function renderRun(data) { setStatus(data.status); $('title').textContent=data.plan?.goal||statusName(data.status); $('subtitle').textContent=data.resolved_request||data.request; $('answer').textContent=data.answer||'暂无最终答案。'; $('answer').className='answer'+(data.answer?'':' muted'); $('error').innerHTML=data.error?'<div class="error">'+escapeHtml(data.error)+'</div>':''; $('goal').textContent=data.plan?.goal||'尚未生成任务计划。'; metrics(data); rasterStats(data); steps(data); trace(data); const links=[]; const rasterResult=(data.steps||[]).map(s=>s.result||{}).find(x=>x.statistics&&x.bounds); if(rasterResult) rasterPreview(rasterResult); if(data.artifact_ref)links.push('<a href="/artifacts/runs/'+encodeURIComponent(data.artifact_ref.split(/[\\/]/).pop())+'" target="_blank">打开 JSON 运行记录</a>'); if(data.geojson_ref) { links.push('<a href="/artifacts/geojson/'+encodeURIComponent(data.geojson_ref.split(/[\\/]/).pop())+'" target="_blank">打开 GeoJSON 文件</a>'); loadGeoJSON(data.geojson_ref); } $('links').innerHTML=links.join(''); }
    async function sendChat(text) { const request=(text ?? $('prompt').value).trim(); if(!request) return; const button=$('send'); button.disabled=true; $('prompt').value=''; $('chatMeta').textContent='当前会话：'+$('session').value; appendMessage('user',request); setStatus('PLANNING'); $('title').textContent='正在分析'; $('subtitle').textContent='规划器和运行时正在处理请求。'; $('error').innerHTML=''; try { validateSelection(); const response=await fetch('/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request,session_id:$('session').value,planner:$('planner').value,backend:$('backend').value,export_artifact:true,export_geojson:true})}); const data=await response.json(); if(!response.ok) throw new Error(data.error||'请求失败'); renderRun(data); appendMessage('assistant',data.answer||data.error||statusName(data.status)); } catch(e) { setStatus('FAILED'); $('error').innerHTML='<div class="error">'+escapeHtml(e.message)+'</div>'; appendMessage('system',e.message); } finally { button.disabled=false; $('prompt').focus(); } }
    $('send').addEventListener('click',()=>sendChat());
    $('prompt').addEventListener('keydown',event=>{ if(event.key==='Enter'&&!event.shiftKey){ event.preventDefault(); sendChat(); } });
    $('session').addEventListener('input',()=>{$('chatMeta').textContent='当前会话：'+$('session').value;});
    $('newSession').addEventListener('click',newSession);
    $('clearChat').addEventListener('click',clearChat);
    document.querySelectorAll('.example').forEach(button=>button.addEventListener('click',()=>{ $('prompt').value=button.dataset.request; $('prompt').focus(); }));
    welcome();
    loadHealth();
  </script>
</body>
</html>
